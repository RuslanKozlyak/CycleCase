[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cicle-gpx"
version = "0.1.0"
description = "Exploration and visualization of cycling GPX tracks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "folium>=0.18.0",
    "geopandas>=1.0.1",
    "gpxpy>=1.6.2",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.5",
    "networkx>=3.4.2",
    "numpy>=2.1.3",
    "osmnx>=2.1.0",
    "pandas>=2.2.3",
    "pyproj>=3.7.0",
    "requests>=2.32.3",
    "scipy>=1.14.1",
    "shapely>=2.0.6",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
