[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cicle-gpx"
version = "0.1.0"
description = "Cycling routes hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.8",
    "cloudpickle>=3.0",
    "folium>=0.18.0",
    "geopandas>=1.0.1",
    "gpxpy>=1.6.2",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.5",
    "keras>=3.12.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.9.0",
    "networkx>=3.4.2",
    "numpy>=2.1.3",
    "optuna>=4.0",
    "osmnx>=2.1.0",
    "pandas>=2.2.3",
    "pyproj>=3.7.0",
    "pyarrow>=17.0",
    "requests>=2.32.3",
    "scipy>=1.14.1",
    "scikit-learn>=1.6.0",
    "shapely>=2.0.6",
    "statsmodels>=0.14.5",
    "tensorflow>=2.21.0",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
    "xgboost>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cycle_routing = ["assets/leaflet/*", "assets/*.html"]
